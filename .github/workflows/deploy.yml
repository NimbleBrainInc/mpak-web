name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Scoped per job rather than workflow-wide: the build runs `npm ci`, which
# executes dependency lifecycle scripts, and that should not happen with a token
# that can publish to Pages.
permissions:
  contents: read

# Let a running deploy finish rather than cancelling it — a half-deployed site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # v5 excludes hidden files by default; keep v3's include-everything
          # behavior. Nothing in the build is hidden today — this is insurance
          # against something that is.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
